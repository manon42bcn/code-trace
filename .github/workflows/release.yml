name: Stable release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

env:
  PROMOTION_SHA: ${{ github.event.pull_request.merge_commit_sha }}
  PROMOTED_DEV: ${{ github.event.pull_request.head.sha }}

jobs:
  prepare:
    if: >-
      vars.RELEASE_AUTOMATION_ENABLED == 'true' &&
      github.event.pull_request.merged &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.prepare.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.PROMOTION_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Test and package the stable commit
        id: prepare
        run: |
          python3 scripts/release.py prepare "$RUNNER_TEMP/release"
          echo "artifact=stable-release-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.PROMOTION_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/release
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Publish and open the next development cycle
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh auth setup-git --hostname github.com
          python3 scripts/release.py publish "$RUNNER_TEMP/release"
